
<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>
<style>
  :root{
    --gold:#a8394d;
    --dark:#2b2726;
    --cream:#f2ece6;
    --grey:#b7aead;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Verdana', 'Times New Roman', serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(230,190,120,0.08) 0, transparent 22%),
      radial-gradient(circle at 85% 15%, rgba(220,150,160,0.08) 0, transparent 24%),
      radial-gradient(circle at 75% 75%, rgba(168,57,77,0.12) 0, transparent 28%),
      radial-gradient(circle at 15% 80%, rgba(242,236,230,0.06) 0, transparent 20%),
      radial-gradient(circle at 50% 45%, rgba(220,170,180,0.06) 0, transparent 30%),
      repeating-linear-gradient(45deg, rgba(168,57,77,0.04) 0px, rgba(168,57,77,0.04) 2px, transparent 2px, transparent 42px),
      repeating-linear-gradient(-45deg, rgba(230,190,120,0.03) 0px, rgba(230,190,120,0.03) 2px, transparent 2px, transparent 42px),
      linear-gradient(135deg,#2b2828,#3a2626);
    background-attachment:fixed;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--cream);
    overflow-x:hidden;
  }
  body[dir="rtl"]{
    font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;
  }

  /* ---------- Name Prompt ---------- */
  #nameScreen{
    position:fixed;inset:0;
    background:#242424;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    z-index:10;
    text-align:center;
    padding:20px;
  }
  #nameScreen h2{
    font-weight:400;
    letter-spacing:1px;
    color:var(--gold);
  }
  #nameInput{
    padding:12px 16px;
    border-radius:6px;
    border:1px solid var(--gold);
    background:transparent;
    color:var(--cream);
    font-size:16px;
    width:260px;
    text-align:center;
    outline:none;
  }
  #nameInput::placeholder{color:#c4c4c499;}

  .lang-options{
    display:flex;
    gap:10px;
  }
  .lang-options button{
    padding:8px 18px;
    border-radius:6px;
    border:1px solid var(--gold);
    background:transparent;
    color:var(--cream);
    cursor:pointer;
    font-size:14px;
    letter-spacing:.5px;
    transition:.25s;
  }
  .lang-options button.active{
    background:var(--gold);
    color:var(--cream);
  }

  #nameSubmit{
    padding:12px 28px;
    border-radius:6px;
    border:1px solid var(--gold);
    background:var(--gold);
    color:var(--cream);
    font-size:15px;
    letter-spacing:1px;
    cursor:pointer;
    transition:.25s;
  }
  #nameSubmit:hover{background:transparent;color:var(--gold);}

  /* ---------- Invitation ---------- */
  #invite{
    display:none;
    max-width:600px;
    width:100%;
    margin:40px auto;
    padding:50px 30px;
    text-align:center;
    position:relative;
    perspective:1200px;
  }
  .frame{
    border:1px solid var(--gold);
    padding:40px 20px;
    position:relative;
    opacity:0;
    animation:fadeUp 1.4s ease forwards;
    background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(0,0,0,0.15));
    border-radius:8px;
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    box-shadow:
      0 25px 50px rgba(0,0,0,.55),
      0 10px 20px rgba(196,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.12),
      inset 0 -1px 0 rgba(0,0,0,.3);
    transform:rotateX(0deg) rotateY(0deg);
    transform-style:preserve-3d;
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .frame:hover{
    transform:rotateX(0deg) rotateY(0deg) translateY(-6px);
    box-shadow:
      0 30px 60px rgba(0,0,0,.6),
      0 14px 26px rgba(196,0,0,.3),
      inset 0 1px 0 rgba(255,255,255,.15),
      inset 0 -1px 0 rgba(0,0,0,.3);
  }
  .frame::before,.frame::after{
    content:"";
    position:absolute;
    width:18px;height:18px;
    border:1px solid var(--gold);
  }
  .frame::before{top:-8px;left:-8px;border-right:none;border-bottom:none;}
  .frame::after{bottom:-8px;right:-8px;border-left:none;border-top:none;}

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(30px) rotateX(0deg) rotateY(0deg);}
    to{opacity:1;transform:translateY(0) rotateX(0deg) rotateY(0deg);}
  }

  #greeting{
    font-size:15px;
    letter-spacing:2px;
    color:var(--grey);
    text-transform:uppercase;
    opacity:0;
    animation:fadeIn 1s ease forwards .3s;
  }
  #inviteText{
    font-size:16px;
    margin-top:18px;
    color:var(--cream);
    opacity:0;
    animation:fadeIn 1s ease forwards .8s;
  }
  #couple{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-size:34px;
    margin:20px 0;
    color:#ffffff;
    font-family:'Brush Script MT', cursive;
    opacity:0;
    animation:fadeIn 1.2s ease forwards 1.3s, glowPulse 3s ease-in-out infinite 2.5s;
    text-shadow:0 0 8px rgba(168,57,77,.55), 0 0 18px rgba(168,57,77,.3);
  }
  #coupleAmp{
    font-size:20px;
    color:var(--gold);
    font-family:'Georgia','Times New Roman',serif;
    margin:2px 0;
  }
  body[dir="rtl"] #couple{
    font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;
    font-weight:700;
  }
  body[dir="rtl"] #coupleAmp{
    font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;
    font-weight:400;
  }
  @keyframes glowPulse{
    0%,100%{text-shadow:0 0 8px rgba(168,57,77,.55), 0 0 18px rgba(168,57,77,.3);}
    50%{text-shadow:0 0 16px rgba(168,57,77,.8), 0 0 30px rgba(168,57,77,.45);}
  }
  .divider{
    width:60px;height:1px;
    background:var(--gold);
    margin:20px auto;
    opacity:0;
    animation:fadeIn 1s ease forwards 1.8s;
  }
  .detail{
    margin:14px 0;
    font-size:21px;
    font-weight:normal;
    color:var(--grey);
    opacity:0;
    animation:fadeIn 1s ease forwards 2.1s;
  }
  .detail span{display:block;color:var(--gold);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;font-weight:normal;}
  .detail span.detail-value{color:var(--grey);font-size:21px;font-weight:bold;text-transform:none;letter-spacing:0;}
  #thanks{
    margin-top:30px;
    font-style:italic;
    color:var(--grey);
    opacity:0;
    animation:fadeIn 1.2s ease forwards 2.6s;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* ---------- RSVP ---------- */
  #rsvp{
    margin-top:40px;
    opacity:0;
    animation:fadeIn 1.2s ease forwards 3.1s;
  }
  #rsvp h3{
    color:var(--gold);
    font-weight:400;
    margin-bottom:16px;
    letter-spacing:1px;
  }
  .rsvp-options{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .rsvp-options button{
    padding:10px 22px;
    border-radius:6px;
    border:1px solid var(--gold);
    background:transparent;
    color:var(--cream);
    cursor:pointer;
    font-size:14px;
    letter-spacing:.5px;
    transition:.25s;
  }
  .rsvp-options button.active{
    background:var(--gold);
    color:var(--cream);
  }
  #plusOneWrap{
    display:none;
    margin-top:10px;
    animation:fadeIn .5s ease;
  }
  #plusOneWrap label{
    display:block;
    font-size:13px;
    color:var(--grey);
    margin-bottom:8px;
  }
  select, input[type=text]{
    padding:8px 12px;
    border-radius:6px;
    border:1px solid var(--gold);
    background:transparent;
    color:var(--cream);
    font-size:14px;
  }
  #confirmBtn{
    display:block;
    margin:24px auto 0;
    padding:12px 30px;
    border-radius:6px;
    border:1px solid var(--gold);
    background:var(--gold);
    color:var(--cream);
    font-size:15px;
    letter-spacing:1px;
    cursor:pointer;
    transition:.25s;
  }
  #confirmBtn:hover{background:transparent;color:var(--gold);}
  #confirmedMsg{
    margin-top:20px;
    color:var(--gold);
    font-style:italic;
    display:none;
  }

  #plusCountWrap{
    display:none;
    margin-top:12px;
    animation:fadeIn .5s ease;
  }
  #plusCountWrap label{
    display:block;
    font-size:13px;
    color:var(--grey);
    margin-bottom:8px;
  }
  #plusCount{
    width:70px;
    text-align:center;
  }

  #msgWrap{
    margin-top:20px;
    animation:fadeIn .5s ease;
  }
  #msgWrap label{
    display:block;
    font-size:13px;
    color:var(--grey);
    margin-bottom:8px;
  }
  #guestMsg{
    width:100%;
    max-width:100%;
    padding:10px 12px;
    border-radius:6px;
    border:1px solid var(--gold);
    background:transparent;
    color:var(--cream);
    font-size:14px;
    font-family:inherit;
    resize:vertical;
    outline:none;
  }
  #guestMsg::placeholder{color:#c4c4c499;}

  /* ---------- Ambient petals ---------- */
  #petals{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
  }
  .petal{
    position:absolute;
    top:-40px;
    font-size:22px;
    opacity:.5;
    animation:fall linear infinite, sway ease-in-out infinite;
    user-select:none;
    text-shadow:0 0 10px rgba(168,57,77,.45), 0 0 14px rgba(242,236,230,.3);
  }
  @keyframes fall{
    from{transform:translateY(-10vh);}
    to{transform:translateY(110vh);}
  }
  @keyframes sway{
    0%,100%{margin-left:0;}
    50%{margin-left:40px;}
  }

  /* ---------- Confetti ---------- */
  #confettiCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:20;
  }

  #invite, #nameScreen{position:relative;z-index:2;}
</style>
</head>
<body id="pageBody">

<div id="petals"></div>
<canvas id="confettiCanvas"></canvas>

<!-- Name Prompt -->
<div id="nameScreen">
  <h2 id="namePrompt">Please enter your name</h2>
  <input type="text" id="nameInput" placeholder="Your full name">

  <div class="lang-options">
    <button type="button" class="lang-btn" data-lang="en">English</button>
    <button type="button" class="lang-btn active" data-lang="ar">العربية</button>
  </div>

  <button id="nameSubmit">Continue</button>
</div>

<!-- Invitation -->
<div id="invite">
  <div class="frame">
    <div id="greeting">Dear <span id="guestName"></span></div>
    <div id="inviteText">You're invited to the wedding of:</div>
    <div id="couple">
      <span id="coupleA">Ahmed Gado</span>
      <span id="coupleAmp">&amp;</span>
      <span id="coupleB">Israa Ahmed</span>
    </div>
    <div class="divider"></div>

    <div class="detail"><span id="labelDate">Date</span><span id="valDate" class="detail-value"></span></div>
    <div class="detail"><span id="labelTime">Time</span><span id="valTime" class="detail-value"></span></div>
    <div class="detail"><span id="labelLocation">Location</span><span id="valLocation" class="detail-value"></span></div>

    <p id="thanks">We would be truly honored to have you celebrate this beautiful day with us. Thank you for being a part of our journey.</p>

    <div id="rsvp">
      <h3 id="rsvpTitle">Will you be attending?</h3>
      <div class="rsvp-options">
        <button id="btnYes" type="button">Yes, I'll be there</button>
        <button id="btnNo" type="button">Sorry, can't make it</button>
      </div>

      <div id="plusOneWrap">
        <label for="plusOne" id="plusOneLabel">Will you bring a plus one?</label>
        <select id="plusOne">
          <option value="no" id="plusOneNo">No, just me</option>
          <option value="yes" id="plusOneYes">Yes, I'm bringing someone</option>
        </select>

        <div id="plusCountWrap">
          <label for="plusCount" id="plusCountLabel">How many guests will you bring?</label>
          <input type="number" id="plusCount" min="1" max="10" value="1">
        </div>
      </div>

      <div id="msgWrap">
        <label for="guestMsg" id="guestMsgLabel">Leave a message for the couple (optional)</label>
        <textarea id="guestMsg" rows="3" placeholder=""></textarea>
      </div>

      <button id="confirmBtn">Confirm RSVP</button>
      <p id="confirmedMsg"></p>
    </div>
  </div>
</div>

<script>
  /* =========================================================
     EDIT YOUR INVITATION DETAILS HERE
     Provide both English (en) and Arabic (ar) versions.
     ========================================================= */
  const CONFIG = {
    coupleA: { en: "Ahmed Gado", ar: "أحمد جادو" },
    coupleB: { en: "Israa Ahmed", ar: "إسراء أحمد" },
    date:    { en: "Saturday, 01 Jan 2027", ar: "الجمعة، ١ يناير ٢٠٢٧" },
    time:    { en: "4:00 PM", ar: "٤:٠٠ مساءً" },
    location:{ en: "The Garden Hall, Cairo", ar: "قاعة الحدائق، القاهرة" }
  };

  // Paste your Google Apps Script Web App URL here
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLz6wlgM89rnLVnWgh3G8kegKlEiiZzfffvUkdvZ8tSpwANWtjxIEskQmBpN2x_MuSFw/exec";

  /* =========================================================
     UI TEXT TRANSLATIONS — edit wording here if needed
     ========================================================= */
  const T = {
    en: {
      dir: "ltr",
      namePrompt: "Please enter your name",
      namePlaceholder: "Your full name",
      continueBtn: "Continue",
      dear: "Dear",
      inviteText: "You're invited to the wedding of:",
      labelDate: "Date",
      labelTime: "Time",
      labelLocation: "Location",
      thanks: "We would be truly honored to have you celebrate this beautiful day with us. Thank you for being a part of our journey.",
      rsvpTitle: "Will you be attending?",
      yesBtn: "Yes, I'll be there",
      noBtn: "Sorry, can't make it",
      plusOneLabel: "Will you bring a plus one?",
      plusOneNo: "No, just me",
      plusOneYes: "Yes, I'm bringing someone",
      plusCountLabel: "How many guests will you bring?",
      guestMsgLabel: "Leave a message for the couple (optional)",
      guestMsgPlaceholder: "Write your wishes here...",
      confirmBtn: "Confirm RSVP",
      pleaseRespond: "Please let us know if you can attend.",
      confirmYesGuests: (name, n) => `Wonderful, ${name}! We can't wait to celebrate with you and ${n} guest${n > 1 ? 's' : ''}.`,
      confirmYesSolo: (name) => `Wonderful, ${name}! We can't wait to celebrate with you.`,
      confirmNo: (name) => `Thank you for letting us know, ${name}. You'll be missed!`
    },
    ar: {
      dir: "rtl",
      namePrompt: "اكتب اسمك من فضلك",
      namePlaceholder: "اسمك كامل",
      continueBtn: "افتح المفاجأة",
      dear: "يا",
      inviteText: "نحب ندعوكم لفرحتنا",
      labelDate: "التاريخ",
      labelTime: "الميعاد",
      labelLocation: "المكان",
      thanks: "يشرفنا وجودكم معانا في يوم فرحتنا. شكرًا إنكم جزء من حياتنا.",
      rsvpTitle: "هتيجوا الفرح؟",
      yesBtn: "أكيد هكون موجود",
      noBtn: "للأسف مش هقدر أجي",
      plusOneLabel: "هتيجي مع حد؟",
      plusOneNo: "لأ، هيجي لوحدي",
      plusOneYes: "أيوه، هجيب حد معايا",
      plusCountLabel: "هتجيبوا كام معاكوا؟",
      guestMsgLabel: "حابب تقولنا حاجة؟ (اختياري)",
      guestMsgPlaceholder: "اكتب تهنئتك أو كلمة حلوة هنا...",
      confirmBtn: "أكد الحضور",
      pleaseRespond: "قولنا هتيجوا ولا لأ من فضلك.",
      confirmYesGuests: (name, n) => `تمام يا ${name}! مستنينك إنت و ${n} من ضيوفك.`,
      confirmYesSolo: (name) => `تمام يا ${name}! مستنينك تفرح معانا.`,
      confirmNo: (name) => `شكرًا إنك قولتلنا يا ${name}، هتفتقدك!`
    }
  };

  let currentLang = "ar";
  let attending = null;

  /* ---------- Language toggle on name screen ---------- */
  const langButtons = document.querySelectorAll('.lang-btn');
  function updateNameScreenText(){
    document.getElementById('namePrompt').textContent = T[currentLang].namePrompt;
    document.getElementById('nameInput').placeholder = T[currentLang].namePlaceholder;
    document.getElementById('nameSubmit').textContent = T[currentLang].continueBtn;
    document.getElementById('nameScreen').setAttribute('dir', T[currentLang].dir);
  }

  langButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      langButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentLang = btn.dataset.lang;
      updateNameScreenText();
    });
  });

  updateNameScreenText();

  /* ---------- Apply chosen language to the invitation ---------- */
  function applyLanguage(lang){
    const t = T[lang];
    const body = document.getElementById('pageBody');
    const html = document.getElementById('htmlRoot');
    body.setAttribute('dir', t.dir);
    html.setAttribute('lang', lang);

    document.getElementById('inviteText').textContent = t.inviteText;
    document.getElementById('coupleA').textContent = CONFIG.coupleA[lang];
    document.getElementById('coupleB').textContent = CONFIG.coupleB[lang];
    document.getElementById('coupleAmp').textContent = lang === 'ar' ? 'و' : '&';
    document.getElementById('labelDate').textContent = t.labelDate;
    document.getElementById('labelTime').textContent = t.labelTime;
    document.getElementById('labelLocation').textContent = t.labelLocation;
    document.getElementById('valDate').textContent = CONFIG.date[lang];
    document.getElementById('valTime').textContent = CONFIG.time[lang];
    document.getElementById('valLocation').textContent = CONFIG.location[lang];
    document.getElementById('thanks').textContent = t.thanks;
    document.getElementById('rsvpTitle').textContent = t.rsvpTitle;
    document.getElementById('btnYes').textContent = t.yesBtn;
    document.getElementById('btnNo').textContent = t.noBtn;
    document.getElementById('plusOneLabel').textContent = t.plusOneLabel;
    document.getElementById('plusOneNo').textContent = t.plusOneNo;
    document.getElementById('plusOneYes').textContent = t.plusOneYes;
    document.getElementById('plusCountLabel').textContent = t.plusCountLabel;
    document.getElementById('guestMsgLabel').textContent = t.guestMsgLabel;
    document.getElementById('guestMsg').placeholder = t.guestMsgPlaceholder;
    document.getElementById('confirmBtn').textContent = t.confirmBtn;
  }

  /* ---------- Name screen -> Invitation ---------- */
  const nameScreen = document.getElementById('nameScreen');
  const nameInput = document.getElementById('nameInput');
  const nameSubmit = document.getElementById('nameSubmit');
  const invite = document.getElementById('invite');
  const guestName = document.getElementById('guestName');
  const greeting = document.getElementById('greeting');

  function startInvite(){
    const val = nameInput.value.trim();
    if(!val){
      nameInput.style.borderColor = '#ff5555';
      nameInput.placeholder = currentLang === 'ar' ? 'من فضلك اكتب اسمك' : 'Please enter your name';
      nameInput.focus();
      return;
    }
    nameInput.style.borderColor = 'var(--gold)';
    guestName.textContent = val;
    greeting.childNodes[0].textContent = T[currentLang].dear + " ";
    applyLanguage(currentLang);
    nameScreen.style.display = 'none';
    invite.style.display = 'block';
  }

  nameSubmit.addEventListener('click', startInvite);
  nameInput.addEventListener('keydown', e => { if(e.key === 'Enter') startInvite(); });

  /* ---------- RSVP flow ---------- */
  const btnYes = document.getElementById('btnYes');
  const btnNo = document.getElementById('btnNo');
  const plusOneWrap = document.getElementById('plusOneWrap');
  const plusCountWrap = document.getElementById('plusCountWrap');
  const plusOneSelect = document.getElementById('plusOne');

  plusOneSelect.addEventListener('change', () => {
    plusCountWrap.style.display = plusOneSelect.value === 'yes' ? 'block' : 'none';
  });

  btnYes.addEventListener('click', () => {
    attending = true;
    btnYes.classList.add('active');
    btnNo.classList.remove('active');
    plusOneWrap.style.display = 'block';
  });

  btnNo.addEventListener('click', () => {
    attending = false;
    btnNo.classList.add('active');
    btnYes.classList.remove('active');
    plusOneWrap.style.display = 'none';
  });

  function sendRSVP(payload){
    if(!SCRIPT_URL || SCRIPT_URL === "YOUR_SCRIPT_URL_HERE") return; // not configured yet
    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(payload)
    }).catch(err => console.error("RSVP submit failed:", err));
  }

  document.getElementById('confirmBtn').addEventListener('click', () => {
    const msg = document.getElementById('confirmedMsg');
    const t = T[currentLang];
    if(attending === null){
      msg.style.display = 'block';
      msg.style.color = '#e08787';
      msg.textContent = t.pleaseRespond;
      return;
    }
    const name = guestName.textContent;
    let guests = 0;
    if(attending){
      const plusOne = document.getElementById('plusOne').value;
      if(plusOne === 'yes'){
        guests = parseInt(document.getElementById('plusCount').value || '1', 10);
        msg.textContent = t.confirmYesGuests(name, guests);
      } else {
        msg.textContent = t.confirmYesSolo(name);
      }
      launchConfetti();
    } else {
      msg.textContent = t.confirmNo(name);
    }
    msg.style.color = 'var(--cream)';
    msg.style.display = 'block';

    sendRSVP({
      name: name,
      attending: attending ? "Yes" : "No",
      guests: guests,
      message: document.getElementById('guestMsg').value.trim(),
      language: currentLang
    });
  });

  /* ---------- Ambient falling petals ---------- */
  const petalEmojis = ['🎊','✨','🌟','🌹','🌷','💐','🌸','💖','💕','💘','♥️'];
  const petalsContainer = document.getElementById('petals');
  for(let i = 0; i < 18; i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.fontSize = (16 + Math.random() * 16) + 'px';
    const fallDuration = 10 + Math.random() * 12;
    const swayDuration = 3 + Math.random() * 3;
    p.style.animationDuration = `${fallDuration}s, ${swayDuration}s`;
    p.style.animationDelay = `${Math.random() * 10}s, 0s`;
    petalsContainer.appendChild(p);
  }

  /* ---------- Confetti burst ---------- */
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const confettiColors = ['#c9a35c','#e8ddc7','#e08787','#8fae8b','#8fa7c9','#d8b4e2'];

  function launchConfetti(){
    const pieces = [];
    const count = 140;
    for(let i = 0; i < count; i++){
      pieces.push({
        x: canvas.width / 2,
        y: canvas.height / 3,
        vx: (Math.random() - 0.5) * 12,
        vy: Math.random() * -10 - 4,
        size: 4 + Math.random() * 5,
        color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 10,
        gravity: 0.25 + Math.random() * 0.15,
        life: 0
      });
    }

    let frame = 0;
    const maxFrames = 160;

    function animate(){
      frame++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rotSpeed;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      });
      if(frame < maxFrames){
        requestAnimationFrame(animate);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
    animate();
  }
</script>
